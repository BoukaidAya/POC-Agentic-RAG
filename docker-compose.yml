services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      # Publie sur 9201 cote hote : le port 9200 est deja pris par un autre
      # conteneur OpenSearch sur cette machine. En interne le port reste 9200,
      # et le service "app" y accede par le nom "opensearch:9200" (nom de service
      # Docker), donc ce remapping n'impacte pas l'app -- seulement l'acces
      # depuis l'hote (debug/dashboards), qui passe alors par localhost:9201.
      - 9201:9200
      - 9600:9600
    networks:
      - agentic-rag-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    networks:
      - agentic-rag-net
    depends_on:
      - opensearch

  postgres:
    image: postgres:16-alpine
    container_name: postgres-acl
    environment:
      - POSTGRES_USER=ragadmin
      - POSTGRES_PASSWORD=ragadmin_dev_only
      - POSTGRES_DB=agentic_rag
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agentic-rag-net

  # Partie Python/torch, en Linux, pour contourner Smart App Control de Windows.
  # Le code est monte en volume (.:/app) -> les sorties atterrissent sur l'hote.
  # Reseau : par defaut on parle a OpenSearch/PostgreSQL par leur nom de service
  # (variables OS_HOST / PG_DSN, surchargeables). Le cache HuggingFace est
  # persiste (hf-cache) pour ne pas re-telecharger BGE-M3 (~2.2 Go) a chaque run.
  app:
    build: .
    container_name: ragapp
    environment:
      - OS_HOST=${OS_HOST:-opensearch}
      - OS_PORT=${OS_PORT:-9200}
      - PG_DSN=${PG_DSN:-host=postgres port=5432 dbname=agentic_rag user=ragadmin password=ragadmin_dev_only}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - .:/app
      - hf-cache:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentic-rag-net

networks:
  agentic-rag-net:

volumes:
  opensearch-data:
  postgres-data:
  hf-cache:
